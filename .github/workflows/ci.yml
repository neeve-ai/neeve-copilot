name: Validation CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Robin Skill Packaging
        run: |
          echo "Checking Robin skills-src packages cleanly into release zips..."
          neeve/products/robin/scripts/skills_sync.sh check

      - name: Verify Robin Prompt Files
        run: |
          echo "Checking Robin prompts-src frontmatter..."
          neeve/products/robin/scripts/prompts_sync.sh check

      - name: Verify Context Renderer
        run: |
          echo "Smoke-testing context_render.py against every registered repo..."
          FAIL=0
          for repo_yaml in neeve/products/robin/context-src/repos/*.yaml; do
            repo="$(basename "$repo_yaml" .yaml)"
            tmp_dir="$(mktemp -d)"
            if ! python3 neeve/products/robin/scripts/context_render.py "$repo" --write "$tmp_dir"; then
              echo "::error::context_render.py failed to render repo: $repo"
              FAIL=1
            fi
            rm -rf "$tmp_dir"
          done
          echo "Smoke-testing --house-rules (global, no repo arg)..."
          if ! python3 neeve/products/robin/scripts/context_render.py --house-rules "$(mktemp)"; then
            echo "::error::context_render.py --house-rules failed"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi

      - name: Run Context Renderer Unit Tests
        run: |
          echo "Running test_context_render.py..."
          python3 neeve/products/robin/scripts/test_context_render.py -v

      - name: Run House-Rules Merge Unit Tests
        run: |
          echo "Running test_merge_house_rules.py..."
          python3 neeve/products/robin/scripts/test_merge_house_rules.py -v

      - name: Verify neeve/org Consistency
        run: |
          echo "Checking neeve/org agent citations stay consistent with security.md/PRINCIPLES.md..."
          python3 neeve/org/scripts/check_org_sync.py
