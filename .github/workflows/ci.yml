name: Validation CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Shared Reference Docs Are In Sync
        run: |
          echo "Checking generated copies match canonical neeve/references/..."
          bash neeve/scripts/shared_refs_sync.sh check

      - name: Verify Skill Packaging
        run: |
          echo "Checking both skills-src roots package cleanly into release zips..."
          neeve/scripts/skills_sync.sh check

      - name: Verify Robin Prompt Files
        run: |
          echo "Checking Robin prompts-src frontmatter..."
          neeve/scripts/prompts_sync.sh check

      - name: Verify Context Renderer
        run: |
          echo "Smoke-testing context_render.py against every registered repo..."
          FAIL=0
          for repo_yaml in neeve/products/robin/context-src/repos/*.yaml; do
            repo="$(basename "$repo_yaml" .yaml)"
            tmp_dir="$(mktemp -d)"
            if ! python3 neeve/scripts/context_render.py "$repo" --write "$tmp_dir"; then
              echo "::error::context_render.py failed to render repo: $repo"
              FAIL=1
            fi
            rm -rf "$tmp_dir"
          done
          echo "Smoke-testing --house-rules (global, no repo arg)..."
          if ! python3 neeve/scripts/context_render.py --house-rules "$(mktemp)"; then
            echo "::error::context_render.py --house-rules failed"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi

      - name: Run Context Renderer Unit Tests
        run: |
          echo "Running test_context_render.py..."
          python3 neeve/scripts/test_context_render.py -v

      - name: Run House-Rules Merge Unit Tests
        run: |
          echo "Running test_merge_house_rules.py..."
          python3 neeve/scripts/test_merge_house_rules.py -v

      - name: Run Agents Renderer Unit Tests
        run: |
          echo "Running test_agents_render.py..."
          python3 neeve/scripts/test_agents_render.py -v

      - name: Verify Agents Renderer (smoke test every registered agent)
        run: |
          echo "Smoke-testing agents_render.py against every registered agent..."
          FAIL=0
          for agent_dir in neeve/agent-src/*/; do
            agent="$(basename "$agent_dir")"
            [ -f "${agent_dir}AGENT.md" ] || continue
            tmp_dir="$(mktemp -d)"
            if ! python3 neeve/scripts/agents_render.py "$agent" --claude "$tmp_dir/claude.md"; then
              echo "::error::agents_render.py --claude failed for: $agent"; FAIL=1
            fi
            if ! python3 neeve/scripts/agents_render.py "$agent" --copilot "$tmp_dir/copilot.agent.md"; then
              echo "::error::agents_render.py --copilot failed for: $agent"; FAIL=1
            fi
            if ! python3 neeve/scripts/agents_render.py "$agent" --codex "$tmp_dir/codex.toml"; then
              echo "::error::agents_render.py --codex failed for: $agent"; FAIL=1
            fi
            if ! python3 neeve/scripts/agents_render.py "$agent" --skill-fallback "$tmp_dir/skill"; then
              echo "::error::agents_render.py --skill-fallback failed for: $agent"; FAIL=1
            fi
            rm -rf "$tmp_dir"
          done
          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi

      - name: Run Session-Hook Merge Unit Tests
        run: |
          echo "Running test_merge_session_hook.py..."
          python3 neeve/scripts/test_merge_session_hook.py -v

      - name: Verify neeve/org Consistency
        run: |
          echo "Checking the neeve agent routes every skill and reference citations stay consistent..."
          python3 neeve/org/scripts/check_org_sync.py
