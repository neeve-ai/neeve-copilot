name: Context Drift Check (reusable)

on:
  workflow_call:
    inputs:
      repo:
        description: >
          Repo name, must match a file in
          neeve-copilot/neeve/products/robin/context-src/repos/<repo>.yaml
        required: true
        type: string
      neeve_copilot_ref:
        description: Ref of neeve-ai/neeve-copilot to check against
        required: false
        type: string
        default: main

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout neeve-copilot
        uses: actions/checkout@v4
        with:
          repository: neeve-ai/neeve-copilot
          ref: ${{ inputs.neeve_copilot_ref }}
          path: neeve-copilot

      - name: Render and diff against committed context files
        run: |
          python3 neeve-copilot/neeve/products/robin/scripts/context_render.py \
            "${{ inputs.repo }}" --check "${{ github.workspace }}/target"

      - name: Guard against gitignored rendered files
        working-directory: target
        run: |
          echo "Confirming none of the 4 rendered instruction files can be silently excluded from git..."
          FAIL=0
          for f in AGENTS.md CLAUDE.md .cursorrules .github/copilot-instructions.md; do
            if git check-ignore -q "$f"; then
              echo "::error::$f is gitignored in this repo — it can never be committed, breaking the one-render/four-synced-files guarantee. Remove the matching .gitignore rule."
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi
          echo "None of the 4 rendered files are gitignored."
