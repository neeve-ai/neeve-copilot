name: Context Sync on Merge (reusable)

# Fires from a thin per-repo trigger workflow on push to that repo's main
# (i.e. every time a PR merges there). Renders this repo's always-on
# instructions, prompts, hooks, and project-scoped skill fresh from
# neeve-copilot's current main, and opens (or updates) a small review PR if
# anything changed. Never auto-commits to main directly.

on:
  workflow_call:
    inputs:
      repo:
        description: >
          Repo name, must match a file in
          neeve-copilot/neeve/products/robin/context-src/repos/<repo>.yaml
        required: true
        type: string
      neeve_copilot_ref:
        description: Ref of neeve-ai/neeve-copilot to sync from
        required: false
        type: string
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Checkout neeve-copilot
        uses: actions/checkout@v4
        with:
          repository: neeve-ai/neeve-copilot
          ref: ${{ inputs.neeve_copilot_ref }}
          path: neeve-copilot

      - name: Render and sync into a local copy
        id: sync
        run: |
          set -e
          OUTPUT=$(python3 neeve-copilot/neeve/products/robin/scripts/context_sync.py \
            "${{ inputs.repo }}" "${{ github.workspace }}/target")
          echo "$OUTPUT"
          if [[ "$OUTPUT" == "NO_CHANGE" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<SYNC_EOF"
              echo "$OUTPUT" | tail -n +2
              echo "SYNC_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the sync PR
        if: steps.sync.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BRANCH="neeve-context-sync"
          git config user.name "neeve-copilot-sync[bot]"
          git config user.email "neeve-copilot-sync@neeve.ai"
          git checkout -B "$BRANCH"
          git add AGENTS.md CLAUDE.md .cursorrules .github/copilot-instructions.md \
            .github/prompts .github/hooks .github/skills 2>/dev/null || true
          git commit -m "chore: sync always-on context from neeve-copilot

          Files changed:
          ${{ steps.sync.outputs.files }}

          Auto-generated by neeve-copilot's context-sync workflow, triggered
          by a merge to main in this repo. Review before merging — this
          never auto-merges."
          git push -f origin "$BRANCH"

          if ! gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr create \
              --title "chore: sync always-on context from neeve-copilot" \
              --body "Auto-generated after a merge to \`main\` in this repo. Regenerates \`AGENTS.md\`/\`CLAUDE.md\`/\`.cursorrules\`/\`.github/copilot-instructions.md\` (and prompts/hooks/skills where applicable) from neeve-copilot's current \`main\`. Review the diff before merging — this workflow never merges on its own." \
              --head "$BRANCH" \
              --base main
          else
            echo "PR already open on $BRANCH — push above updated it."
          fi
