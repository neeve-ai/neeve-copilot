name: Prompts/Hooks/Skills Drift Check (reusable)

on:
  workflow_call:
    inputs:
      repo:
        description: >
          Repo name — used only for logging; the check operates on whatever
          is actually installed under the calling repo's .github/, not a
          yaml lookup.
        required: true
        type: string
      neeve_copilot_ref:
        description: Ref of neeve-ai/neeve-copilot to check against
        required: false
        type: string
        default: main

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout neeve-copilot
        uses: actions/checkout@v4
        with:
          repository: neeve-ai/neeve-copilot
          ref: ${{ inputs.neeve_copilot_ref }}
          path: neeve-copilot

      - name: Diff installed skills against skills-src
        run: |
          bash neeve-copilot/neeve/scripts/skills_sync.sh \
            check-target "${{ github.workspace }}/target"

      - name: Diff installed prompts against prompts-src
        run: |
          bash neeve-copilot/neeve/scripts/prompts_sync.sh \
            check-target "${{ github.workspace }}/target"

      - name: Diff installed hooks against hooks-src
        run: |
          bash neeve-copilot/neeve/scripts/hooks_sync.sh \
            check-target "${{ github.workspace }}/target"
