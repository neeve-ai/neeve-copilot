repo: alc-hello-addon
stack:
  - "Java 11"
  - "Gradle"
  - "WebCTRL add-on framework"
layers:
  - "WebCTRL add-on template — follow the WebCTRL add-on lifecycle conventions, not generic Java web patterns"
test_cmd: "./gradlew test"
lint_cmd: "./gradlew check"
do_not_modify: []
spec_based_development: false
domain_extension: ot-building-automation

local_dev_env_setup: "`gradle.properties` sets `webctrl_home` to your local WebCTRL install (used to resolve WebCTRL JARs at compile time — default is a Windows path, override for macOS/Linux) and the signing keystore config (`jar.signing.*` — defaults are placeholder dev values, not real secrets). No docker-compose: this builds a `.addon` package that installs into a real WebCTRL server, not a local container."
local_dev_start_cmd: "`./gradlew war` (produces the signed-ready `.addon` package via the `war` task, `archiveExtension=addon`) then `./gradlew signWar` (signs it) and `./gradlew verifyWarSignature` (confirms signature). Install by copying the signing cert into `WebCTRL8.0/programdata/addons` (see README.md Signing section) and the built `.addon` into the WebCTRL server's add-on directory, then restart/reload from the WebCTRL UI."
local_dev_run_cmd: null
local_dev_services: []
