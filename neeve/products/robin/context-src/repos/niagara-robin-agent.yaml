repo: niagara-robin-agent
stack:
  - "Java 8"
  - "Tridium Niagara 4 (N4) framework"
  - "Gradle Kotlin DSL"
  - "Hand-rolled MCP / JSON-RPC 2.0"
  - "Gson"
layers:
  - "N4 station/component model — components and BQL queries follow Niagara conventions, not generic OOP patterns"
test_cmd: "./gradlew test"
lint_cmd: "./gradlew check"
do_not_modify:
  - "N4 module/palette descriptors — malformed descriptors can break station loading"
spec_based_development: false
domain_extension: ot-building-automation

local_dev_env_setup: "direnv (`.envrc`) — set `NIAGARA_HOME` to your local Niagara 4.x installation path and `direnv allow` once. No docker-compose here: this module runs *inside* a real Niagara station process, not a containerized service — there is no way to \"run it locally\" without an actual Niagara installation and station."
local_dev_start_cmd: "`./gradlew jar` (compile+package) then copy the built jar from `robinAgent/robinAgent-rt/build/libs/` into your Niagara installation's modules directory and restart the station. See README.md \"Install in Niagara\" for the full Workbench configuration steps (domain/serverId/apiKey property sheet, Connect action)."
local_dev_run_cmd: "`./gradlew niagaraTest` — requires a running/configured station per `gradle.properties`; BQL-dependent tests need live station data and cannot run in isolation."
local_dev_services: []
