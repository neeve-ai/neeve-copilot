repo: robin-adr
stack:
  - "Markdown only — Architecture Decision Records"
layers:
  - "adr/ — numbered ADRs (NNNN-kebab-case-title.md), MADR-style (Status/Date/Context/Decision/Consequences)"
test_cmd: null
lint_cmd: "adr-lint.yml CI validates filename pattern + required H1/Status/Date fields"
