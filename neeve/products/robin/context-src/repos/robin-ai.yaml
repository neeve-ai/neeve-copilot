repo: robin-ai
product_role: "Main backend — the policy/API authority for Robin; owns the primary database schema and orchestrates the other services."
stack:
  - "Python 3.12"
  - "FastAPI"
  - "NATS JetStream"
  - "APISIX gateway"
  - "LiteLLM"
  - "SQLAlchemy / Alembic"
layers:
  - "domain — entities, value objects, protocols"
  - "application — use cases, orchestration"
  - "infrastructure — repositories, ORM, NATS/HTTP clients"
  - "api — FastAPI routers, thin glue only"
test_cmd: "pytest -x -v --cov=app --cov-fail-under=95"
lint_cmd: "mypy app/ --strict && ruff check app/ tests/"
do_not_modify:
  - "alembic/versions/ — migration files are append-only"
  - "app/domain/events/ — event contract shared with downstream services"
spec_based_development: true
domain_extension: null
adr_source_of_truth: "`../robin-adr/Enterprise_Readiness_Workitems.md` (or the relevant ADR in `../robin-adr/adr/`)"
spec_wiki_ref: " (see `robin-ai.wiki/Spec-Based-Development.md`)"
spec_wiki_ref_short: "`Spec-Based-Development.md`"
source_root: "`app/`"

local_dev_env_setup: "direnv (`.envrc`) auto-sources `.env` on `cd` into the repo (via `source_env .env`) and exports `GIT_COMMIT`/`GIT_FULL_COMMIT`. Copy `.env.example` to `.env` and fill in real values before first run — `direnv allow` once per checkout. For real provider API keys (OpenAI/Anthropic/Azure/Chargebee/Grafana Cloud/Langfuse), some engineers keep a personal `setup.sh` at the repo root that `export`s them directly; it is untracked and excluded via `.git/info/exclude` specifically so it's never committed — if you create one, confirm it's excluded the same way before putting a real key in it, and `source setup.sh` before `make run` rather than pasting keys into `.env` if `.env` is ever at risk of being committed by mistake. Never commit `.env` or a secrets-bearing script under any name."
local_dev_start_cmd: "`make setup` (once, installs deps + pre-commit) then `make dev-up` (starts Postgres/Redis/NATS/Vault/MinIO/ClickHouse/Langfuse/APISIX/LiteLLM/Alloy via docker-compose.yml + docker-compose.dev.yml + docker-compose.alloy.yml + docker-compose-apisix.yml + docker-compose.litellm.yml). Use `make dev-up-db` instead for a one-shot full init that also runs DB migrations, LiteLLM budget setup, and Langfuse score config."
local_dev_run_cmd: "`make run` — runs `uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload` directly (expects `make dev-up`'s services already running for DB/Redis/NATS)."
local_dev_stop_cmd: "`make dev-down` — stops dev services, observability stack, and the APISIX gateway."
local_dev_status_cmd: "`make dev-status` (service health) · `make dev-logs` (follow logs) · `make health-check` (app health endpoint)"
local_dev_services:
  - "APISIX Gateway — https://localhost (fronts the API + demo + docs)"
  - "PostgreSQL — localhost:5432 (DATABASE_URL in .env)"
  - "Redis — localhost:6379"
  - "NATS — localhost:4222"
  - "LiteLLM Proxy — http://localhost:4000"
  - "Langfuse — http://localhost:3000"
  - "Grafana Alloy (OTLP/observability) — localhost:4317 (gRPC) / :4318 (HTTP), UI at :12345"
local_dev_db_cmd: "`make migrate` (apply pending Alembic migrations) · `make db-init` (create schema + run all migrations) · `make db-current` (show current revision)"

