repo: robin-helm
stack:
  - "Helm charts (parent/subchart composition)"
  - "Kubernetes"
layers:
  - "apps/ — per-service subcharts"
  - "infra/ — shared infra charts"
  - "finch/ — [repo-specific chart group, verify current layout before assuming]"
test_cmd: "helm unittest [chart] (if configured)"
lint_cmd: "helm lint [chart] && helm template [chart] | kubectl apply --dry-run=client -f -"
do_not_modify:
  - "values files for environments this engineer doesn't own — coordinate before changing shared infra values"
notes: "Keep .github/skills/helm-chart/SKILL.md as-is; this is the one repo that already has a project-scoped skill."
spec_based_development: false
domain_extension: null

local_dev_env_setup: "No .env — this repo deploys to a real Kubernetes cluster, not local docker-compose. `DEVELOPER` (defaults to `whoami`) determines your sandbox namespace (`sbox-$DEVELOPER`) and URL (`https://$DEVELOPER.dev.robin.neeve.ai`); override with `DEVELOPER=<name>` if your shell username doesn't match."
local_dev_start_cmd: "`make dep-update` (repackage subchart .tgz files — required whenever files under `charts/*/` change) then `make dev` (deploys robin-ai + litellm + apisix + robin-web to your sandbox namespace) or `make finch` (admin/debug stack). **This deploys to a shared cluster, not your laptop** — treat `make dev`/`make finch` as touching shared infrastructure, not a purely local action."
local_dev_run_cmd: "`make template` / `make template-apps` / `make template-finch` — dry-run render of manifests (`TEMPLATE_RELEASE`, `VALUES_FILE` override the release/values used) without deploying anything, useful to review before `make dev`."
local_dev_stop_cmd: "`make clean` — removes the deployment from your sandbox namespace."
local_dev_status_cmd: "`make status` · `make logs` · `make port-forward` (local port-forward into the sandbox deployment for debugging)"
local_dev_services: []
