repo: robin-testbench
product_role: "Automated browser-based test harness that exercises Robin's Chrome extension flows end-to-end."
stack:
  - "Python >=3.11"
  - "Poetry"
  - "browsergym"
  - "Agent benchmarking / eval harness"
layers:
  - "This repo evaluates other Robin agents; treat eval scenarios as fixtures, not production code paths"
test_cmd: "pytest -x -v"
lint_cmd: "mypy . --strict && ruff check ."
do_not_modify:
  - "recorded eval baselines — changing them silently hides regressions; any change needs a documented reason"
spec_based_development: false
domain_extension: null

local_dev_env_setup: "No .env — this is a CLI eval harness, not a service. `poetry install` then `poetry shell` (or prefix commands with `poetry run`)."
local_dev_start_cmd: "`poetry run python -m src.robin_testbench.cli.run` (default settings) · add `--config experiments/config/tasks.json` for a specific task config, or `--environment miniwob --task click-test` for a specific environment/task. The `robin` poetry script entry point (`pyproject.toml`) also exposes this as `poetry run robin`."
local_dev_run_cmd: null
local_dev_services: []
