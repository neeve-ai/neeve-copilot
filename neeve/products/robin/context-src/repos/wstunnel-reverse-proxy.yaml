repo: wstunnel-reverse-proxy
stack:
  - "Python >=3.12"
  - "aiohttp"
  - "nats-py"
  - "depends on robin-commons"
layers:
  - "WebSocket tunnel reverse proxy exposing MCP servers behind NAT — keep tunnel/transport logic isolated from routing logic"
test_cmd: "pytest -x -v --cov=app --cov-fail-under=95 && make format && make check"
lint_cmd: "mypy app/ --strict && ruff check app/ tests/"
do_not_modify:
  - "message schema shared with mcp-nats-handler — coordinate changes across both repos"
spec_based_development: false
domain_extension: null

local_dev_env_setup: "No root .env.example — config is via environment variables; check `example/docker-compose.yml` and `example/docker-compose.shared-infra.yml` for what the demo harness sets."
local_dev_start_cmd: "`make install` (poetry deps + pre-commit) for library/unit development. For an end-to-end tunnel demo: `cd example && docker-compose up` — brings up NATS, a NATS CLI debug client, Postgres, a calculator demo service, the reverse proxy, this handler, and multiple simulated tunnel clients (including one modeling a Niagara-side client) so you can exercise real WebSocket tunnel behavior instead of mocking it."
local_dev_run_cmd: null
local_dev_status_cmd: "`make check` (lint + typecheck + test — the full local CI gate, run this before pushing)"
local_dev_services:
  - "nats, natscli — message broker + debug client"
  - "pgsql"
  - "calculator — demo backend service tunneled to"
  - "proxy — the reverse proxy under test"
  - "mcp-nats-handler — companion service also present in this demo"
  - "client_123 / client_456 / client_niagara — simulated tunnel clients, the last modeling a Niagara-side connection"
